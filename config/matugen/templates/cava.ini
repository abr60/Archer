[general]
framerate = 60
autosens = 1
bars = 0
bar_width = 2
bar_spacing = 1

[input]
[input]
method = pipewire
source = auto
sample_rate = 44100
sample_bits = 16

[output]
method = noncurses
channels = stereo

[color]
gradient = 1
gradient_color_1 = '{{colors.primary_container.default.hex}}'
gradient_color_2 = '{{colors.primary.default.hex}}'
gradient_color_3 = '{{colors.on_primary_container.default.hex}}'

[smoothing]
monstercat = 1
noise_reduction = 77


