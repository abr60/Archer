#  ┃┃┃┣┫ ┃ ┃┃┃┓┣ ┃┃
#  ┛ ┗┛┗ ┻ ┗┛┗┛┗┛┛┗

[config]
version_check = false

# ─── Templates ────────────────────────────────────────────────────────────────

[templates.hyprland_lua]
input_path  = "~/.config/matugen/templates/hyprland.lua"
output_path = "~/.config/hypr/bin/colors.lua"
post_hook   = "hyprctl reload"

[templates.hyprlock]
input_path  = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock.conf"

# 2. Bar & notifications — depend on compositor being up
[templates.waybar]
input_path  = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/matugen.css"
post_hook   = "refresh-waybar"

[templates.swaync]
input_path  = "~/.config/matugen/templates/swaync.css"
output_path = "~/.config/swaync/CSS/matugen.css"
post_hook   = "swaync-client -rs"

[templates.swayosd]
input_path  = "~/.config/matugen/templates/swayosd.css"
output_path = "~/.config/swayosd/matugen.css"
post_hook   = "restart-swayosd"

# 3. Terminal
[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook   = "pkill -USR1 kitty"

# 4. Apps
[templates.cava]
input_path  = "~/.config/matugen/templates/cava.ini"
output_path = "~/.config/cava/config"
post_hook   = "pkill -USR1 cava"

[templates.gtk3]
input_path  = "~/.config/matugen/templates/gtk-3.0/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"
post_hook   = 'gtk-theme-reload'

[templates.gtk4]
input_path  = "~/.config/matugen/templates/gtk-4.0/gtk.css"
output_path = "~/.config/gtk-4.0/colors.css"
post_hook   = 'gtk-theme-reload "{{image}}" "{{mode}}"'

# 5. Passive — no post_hook, read fresh on next launch
[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/matugen.rasi"

[templates.rmpc]
input_path  = "~/.config/matugen/templates/rmpc.ron"
output_path = "~/.config/rmpc/themes/matugen.ron"

# ─── Disabled ─────────────────────────────────────────────────────────────────
#[templates.walker]
#[templates.ghostty]
#[templates.spicetify]
#[templates.wlogout]
#[templates.mode-flag]