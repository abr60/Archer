# Configuration Guide: https://wiki.hyprland.org/Configuring/

# --- 1. Archer System Defaults (Do Not Edit) ---
source = ~/.local/share/Archer/default/hypr/envs.conf
source = ~/.local/share/Archer/default/hypr/input.conf
source = ~/.local/share/Archer/default/hypr/looknfeel.conf
source = ~/.local/share/Archer/default/hypr/windows.conf
source = ~/.local/share/Archer/default/hypr/autostart.conf
source = ~/.local/share/Archer/default/hypr/bindings.conf

# --- 2. Archer Default Bindings ---
source = ~/.local/share/Archer/default/hypr/bindings/media.conf
source = ~/.local/share/Archer/default/hypr/bindings/clipboard.conf
source = ~/.local/share/Archer/default/hypr/bindings/tiling.conf
source = ~/.local/share/Archer/default/hypr/bindings/utilities.conf

# --- 3. Theme Configuration ---
# source = ~/.config/Archer/current/theme/hyprland.conf

# --- 4. Personal Overrides (User Settings) ---
# These files overwrite the defaults loaded above
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/plugins.conf
source = ~/.config/hypr/gestures.conf

# --- 5. Custom Rules & Quick Tweaks ---
# source = ~/.local/state/Archer/toggles/hypr/*.conf



