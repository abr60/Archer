# --- Variables & Includes ---
$hypr = ~/.config/hypr
source = $hypr/colors.conf

# --- General & Authentication ---
general {
    no_fade_in = true
    grace = 1
    disable_loading_bar = false
    hide_cursor = true
    ignore_empty_input = false
    text_trim = true
}

# --- Authentication ---
auth {
    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    path = ~/.config/omarchy/current/background
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
}

animations {
    animation = fade, 1, 6, default
}

# --- Top Section ---
label { # Face ID
    monitor = 
    text = <span letter_spacing="4000">FACE ID</span>
    color = rgba(234, 215, 209, 0.5)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = top
}

label { # Lock Icon
    monitor =
    text = <span> </span>
    color = rgba(234, 215, 209, 0.6)
    font_size = 24
    font_family = SF Pro Display Bold
    position = 2, -110
    halign = center
    valign = top
}

label { # Status (Wifi & Battery)
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/bin/wifi-status.sh)   $(~/.config/hypr/bin/battery-status.sh)"
    color = rgba(234, 215, 209, 0.6)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -30, -30
    halign = right
    valign = top
}

# --- Center Section ---
input-field { # Password Input
    monitor =
    size = 250, 60
    outline_thickness = 0
    dots_size = 0.1
    dots_spacing = 1
    dots_center = true
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    font_color = rgba(200, 200, 200, 1)
    font_family = CaskaydiaMono Nerd Font
    fade_on_empty = true
    position = 0, -470
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:1000] echo "$(date +"%d %b %A")"
    color = rgba(234, 215, 209, 0.5)
    font_size = 19
    font_family = JetBrainsMono Nerd Font
    position = -62, -500
    halign = right
    valign = center
}

# --- Bottom Section ---
label { # Clock: Hours
    monitor =
    text = cmd[update:1000] echo "$(date +"%I")"
    color = rgba(234, 215, 209, 0.6)
    font_size = 150
    font_family = SF Pro Display Bold
    shadow_pass = 2
    position = -340, -818
    halign = right
    valign = top
}

label { # Clock: Colon
    monitor =
    text = cmd[update:1000] echo "$([ $(($(date +%S) % 2)) -eq 0 ] && echo ":" || echo " ")"
    color = rgba(234, 215, 209, 0.6)
    font_size = 125
    font_family = SF Pro Display Bold
    position = -266, -835
    halign = right
    valign = top
}

label { # Clock: Minutes
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(234, 215, 209, 0.7)
    font_size = 150
    font_family = SF Pro Display Bold
    shadow_pass = 2
    position = -30, -818
    halign = right
    valign = top
}

label { # Song Info
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/bin/song-status.sh)"
    color = rgba(234, 215, 209, 0.6)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 20, 24
    halign = left
    valign = bottom
}

label { # Weather
    monitor =
    text = cmd[update:300000] echo "$(~/.config/hypr/bin/weather-status.sh)"
    color = rgba(242, 243, 244, 0.75)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 20, 50
    halign = left
    valign = bottom
}

# --- Avatar ---
image {
    monitor    =
    path       = ~/Pictures/adnan/avatar.png
    size       = 200
    rounding   = 1        # -1 makes it a perfect circle
    border_size = 2
    border_color = rgba(242, 243, 244, 0.30)
    position   = 0, 120
    halign     = center
    valign     = center
}