# ── Layer Rules ────────────────────────────────────────────────────────────────

layerrule = blur on,          match:namespace walker
layerrule = ignore_alpha 0,   match:namespace walker

layerrule = blur on,          match:namespace rofi
layerrule = ignore_alpha 0,   match:namespace rofi

layerrule = blur on,          match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar

layerrule = blur on,          match:namespace notifications
layerrule = ignore_alpha 0,   match:namespace notifications

layerrule = blur on,          match:namespace vicinae
layerrule = ignore_alpha 0.1, match:namespace vicinae

layerrule = blur on,          match:namespace swayosd

# Match both floating popups and the main control center panel
layerrule = blur on,          match:namespace ^(notifications|swaync-control-center)$
layerrule = ignore_alpha 0.1, match:namespace ^(notifications|swaync-control-center)$

# ── Window Rules ───────────────────────────────────────────────────────────────

windowrule = fullscreen on,        match:class ^(Waydroid)$

windowrule = float on,             match:class ^(kitty)$, match:title ^(Yazi)$
windowrule = size 700 200,         match:class ^(kitty)$, match:title ^(Yazi)$
windowrule = center on,            match:class ^(kitty)$, match:title ^(Yazi)$

windowrule = float on,             match:class ^(kitty)$, match:title ^(media-download)$
windowrule = size 900 400,         match:class ^(kitty)$, match:title ^(media-download)$
windowrule = center on,            match:class ^(kitty)$, match:title ^(media-download)$

windowrule = float on,             match:class ^(kitty)$, match:title ^(rmpc)$
windowrule = size 900 600,         match:class ^(kitty)$, match:title ^(rmpc)$
windowrule = center on,            match:class ^(kitty)$, match:title ^(rmpc)$

# ── Scroll Sensitivity ─────────────────────────────────────────────────────────

windowrule = scroll_touchpad 1.5,  match:class ^(Alacritty)$
windowrule = scroll_touchpad 0.2,  match:class ^(kitty)$

# ── Wifi QR Code Popup ─────────────────────────────────────────────────────────
windowrule = float on,     match:class ^(kitty)$, match:title ^(wifi-qr)$
windowrule = size 302 416, match:class ^(kitty)$, match:title ^(wifi-qr)$
windowrule = move 967 40,  match:class ^(kitty)$, match:title ^(wifi-qr)$
windowrule = pin on,       match:class ^(kitty)$, match:title ^(wifi-qr)$

# ── Bluetooth Manager (bluetui) Dropdown ────────────────────────────────────────
windowrule = float on,      match:class ^(kitty)$, match:title ^(bluetui)$
windowrule = size 500 410,  match:class ^(kitty)$, match:title ^(bluetui)$
windowrule = move 1550 34,  match:class ^(kitty)$, match:title ^(bluetui)$
windowrule = pin on,        match:class ^(kitty)$, match:title ^(bluetui)$

# ── Wifi Manager (Impala) Dropdown ────────────────────────────────────────────
windowrule = float on,      match:class ^(kitty)$, match:title ^(impala)$
windowrule = size 500 410,  match:class ^(kitty)$, match:title ^(impala)$
windowrule = move 1550 34,  match:class ^(kitty)$, match:title ^(impala)$
windowrule = pin on,        match:class ^(kitty)$, match:title ^(impala)$

# ── rmpc TUI ─────────────────────────────────────────────────────────────────────
windowrule = float on,      match:class ^(kitty)$, match:title ^(rmpc)$
windowrule = size 449 520,  match:class ^(kitty)$, match:title ^(rmpc)$
windowrule = move 10 40,    match:class ^(kitty)$, match:title ^(rmpc)$
windowrule = pin on,        match:class ^(kitty)$, match:title ^(rmpc)$
