cat > ~/.config/matugen/templates/hyprlock.conf << 'TEMPLATE'
# ============================================================
#  hyprlock.conf — generated by matugen on wallpaper change
#  EDIT THE TEMPLATE, NOT THIS FILE:
#  ~/.config/matugen/templates/hyprlock.conf
# ============================================================

# --- General & Authentication ---
general {
    no_fade_in = true
    grace = 1
    disable_loading_bar = false
    hide_cursor = true
    ignore_empty_input = false
    text_trim = true
}

# --- Authentication ---
auth {
    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    path = ~/.local/state/Archer/current-wallpaper
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
}

animations {
    animation = fade, 1, 6, default
}

# --- Top Section ---
label { # Face ID
    monitor =
    text = <span letter_spacing="4000">FACE ID</span>
    color = rgba(c5c8ba66)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -30
    halign = center
    valign = top
}

label { # Lock Icon
    monitor =
    text = <span> </span>
    color = rgba(b1d18acc)
    font_size = 24
    font_family = SF Pro Display Bold
    position = 2, -110
    halign = center
    valign = top
}

label { # Status (Wifi & Battery)
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/assets/hyprlock/wifi-status.sh)   $(~/.config/hypr/assets/hyprlock/battery-status.sh)"
    color = rgba(c5c8ba88)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -30, -30
    halign = right
    valign = top
}

# --- Center Section ---
input-field { # Password Input
    monitor =
    size = 250, 60
    outline_thickness = 0
    dots_size = 0.1
    dots_spacing = 1
    dots_center = true
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    font_color = rgba(b1d18aff)
    font_family = CaskaydiaMono Nerd Font
    fade_on_empty = true
    position = 0, -470
    halign = center
    valign = center
}

label { # Date
    monitor =
    text = cmd[update:1000] echo "$(date +"%d %b %A")"
    color = rgba(b1d18abf)
    font_size = 120
    font_family = Electroharmonix
    position =
    halign = center
    valign = center
}

# --- Bottom Section ---
label { # Clock: Hours
    monitor =
    text = cmd[update:1000] echo "$(date +"%I")"
    color = rgba(b1d18acc)
    font_size = 110
    font_family = stange
    shadow_pass = 2
    position = -280, -818
    halign = right
    valign = top
}

label { # Clock: Colon
    monitor =
    text = cmd[update:1000] echo "$([ $(($(date +%S) % 2)) -eq 0 ] && echo ":" || echo " ")"
    color = rgba(b1d18acc)
    font_size = 125
    font_family = stange
    position = -224, -800
    halign = right
    valign = top
}

label { # Clock: Minutes
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(b1d18acc)
    font_size = 110
    font_family = stange
    shadow_pass = 2
    position = -30, -818
    halign = right
    valign = top
}

label { # Song Info
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/assets/hyprlock/song-status.sh)"
    color = rgba(c5c8ba88)
    font_size = 16
    font_family = electroharmonix
    position = 20, 24
    halign = left
    valign = bottom
}

label { # Weather
    monitor =
    text = cmd[update:300000] echo "$(~/.config/hypr/assets/hyprlock/weather-status.sh)"
    color = rgba(c5c8ba88)
    font_size = 17
    font_family = Michroma
    position = 20, 60
    halign = left
    valign = bottom
}

# --- Avatar ---
#image {
    monitor    =
    path       = ~/Pictures/adnan/avatar.png
    size       = 150
    rounding   = 1
    border_size = 2
    border_color = rgba(b1d18acc)
    position   = 20, 100
    halign     = left
    valign     = bottom
}
TEMPLATE