# ============================================================
#  hyprlock.conf — generated by matugen on wallpaper change
#  EDIT THE TEMPLATE, NOT THIS FILE:
#  ~/.config/matugen/templates/hyprlock.conf
# ============================================================

# --- General & Authentication ---
general {
    no_fade_in = true
    no_fade_out = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = false
    ignore_empty_input = false
    text_trim = true
}

# --- Authentication ---
auth {
    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    path = ~/.local/state/Archer/current-wallpaper
    blur_passes = 2
    contrast = 1
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

animations {
    animation = fade, 1, 6, default
}

# --- Top Right: Wifi & Battery ---
label {
    monitor =
    text = cmd[update:5000] echo "$(~/.config/hypr/scripts/hyprlock/network.sh)"
    color = rgba(dcbfca99)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = -20, -10
    halign = right
    valign = top
}

# --- Date ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(dcbfcabf)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# --- Time ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M")"
    color = rgba(ffafd3bf)
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}

# --- Album Art: Back card (rotated) ---
image {
    monitor =
    size = 256
    rounding = 6
    border_size = 2
    border_color = rgba(ffafd399)
    rotate = -6
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/hyprlock/art.sh
    position = 0, -25
    halign = center
    valign = center
    opacity = 1
}

# --- Album Art: Front card ---
image {
    monitor =
    size = 256
    rounding = 6
    border_size = 3
    border_color = rgba(ffafd3cc)
    rotate = 0
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/hyprlock/art.sh
    position = 0, -25
    halign = center
    valign = center
    opacity = 1
}

# --- Song Title ---
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock/songdetail.sh --title)"
    color = rgba(ffafd3ee)
    font_size = 17
    font_family = Source Code Pro Bold
    position = 0, -200
    halign = center
    valign = center
}

# --- Song Artist ---
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/hyprlock/songdetail.sh --artist)"
    color = rgba(dcbfca99)
    font_size = 15
    font_family = Source Code Pro
    position = 0, -230
    halign = center
    valign = center
}

# --- Input Field ---
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(ffafd3ff)
    font_family = JetBrains Mono
    fade_on_empty = true
    rounding = 32
    fail_color = rgba(ffb4abbf)
    check_color = rgba(ffb4a8bf)
    placeholder_text = <span foreground="##dcbfca">Input Password...</span>
    hide_input = false
    position = 0, -400
    halign = center
    valign = center
}
