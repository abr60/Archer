# General Layout & Styling
font=Monaco Nerd Font Mono, monospace 10
border-size=2
border-radius=8

# Dimensions & Spacing
width=320
height=110
margin=10
padding=12

# Behavior & Icons
icons=1
max-icon-size=48
default-timeout=5000
ignore-timeout=0

# Urgency Overrides (Structure Only)
[urgency=high]
default-timeout=0
