# ── Input ──────────────────────────────────────────────────────────────────────

input {
    kb_options         = compose:rctrl
    repeat_rate        = 40
    repeat_delay       = 600
    numlock_by_default = true
    accel_profile      = flat
    sensitivity        = 0.54

    touchpad {
        scroll_factor        = 0.4
        disable_while_typing = true
    }
}