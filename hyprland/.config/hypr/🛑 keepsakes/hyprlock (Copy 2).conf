# --- Weather ---
label {
    monitor     =
    text        = cmd[update:300000] echo "$(~/.config/hypr/bin/weather-status.sh)"
    color       = rgba(242, 243, 244, 0.75)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 20, 50
    halign      = left
    valign      = bottom
}

# --- Song (bottom left) ---
label {
    monitor     =
    text        = cmd[update:1000] echo "$(~/.config/hypr/bin/song-status.sh)"
    color       = rgba(234, 215, 209, 0.6)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 20, 24
    halign      = left
    valign      = bottom
}

# --- Wifi (bottom right, clear gap from battery) ---
label {
    monitor     =
    text        = cmd[update:5000] echo "$(~/.config/hypr/bin/wifi-status.sh)   $(~/.config/hypr/bin/battery-status.sh)"
    color       = rgba(234, 215, 209, 0.6)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 
    halign      = right
    valign      = top
}

# --- Battery (bottom right edge) ---
#label {
    monitor     =
    text        = cmd[update:1000] echo "$(~/.config/hypr/bin/battery-status.sh)"
    color       = rgba(234, 215, 209, 0.6)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = -24, 24
    halign      = right
    valign      = bottom
}