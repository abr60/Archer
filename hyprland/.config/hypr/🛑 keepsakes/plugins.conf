source = ~/.config/hypr/scripts/Plugins/barcol.css
source = ~/.config/hypr/hyprexpo-binds.conf

# ── Hyprland Plugin Configuration ─────────────────────────────────────────────

plugin {

        hyprexpo {
        # Navigation
        keynav_enable        = 1
        keynav_wrap_h        = 1
        keynav_wrap_v        = 1
        keynav_reading_order = 0

        # Tiles
        gaps_out             = 0
        border_width         = 2
        border_color_current = rgb(66ccff)
        border_color_focus   = rgb(ffcc66)
        border_color_hover   = rgb(aabbcc)
        tile_rounding        = 0
        tile_rounding_power  = 2.0
        tile_rounding_focus   = -1   # -1 = inherit
        tile_rounding_current = -1
        tile_rounding_hover   = -1

        # Labels
        label_enable           = 1
        label_font_size        = 16
        label_font_family      = sans
        label_font_bold        = 0
        label_font_italic      = 0
        label_text_mode        = token   # token | id | index
        label_text_underline   = 0
        label_text_strikethrough = 0
        label_pixel_snap       = 1
        label_position         = top-left   # top-left | top-right | bottom-left | bottom-right | center
        label_offset_x         = 6
        label_offset_y         = 6
        label_show             = always     # always | hover | focus | hover+focus | current+focus | never
        label_color_default    = rgb(ffffff)
        label_color_hover      = rgb(eeeeee)
        label_color_focus      = rgb(ffcc66)
        label_color_current    = rgb(66ccff)
        label_scale_hover      = 1.0
        label_scale_focus      = 1.0
        label_bg_enable        = 1
        label_bg_color         = rgba(00000088)
        label_bg_shape         = circle     # circle | square | rounded
        label_bg_rounding      = 8
        label_padding          = 8
    }

    hyprfocus {
        enabled                  = true
        mode                     = slide   # flash | shrink
        slide_height             = 5
        keyboard_focus_animation = slide
        mouse_focus_animation    = slide
    }

    hyprbars {
        # Visuals
        bar_height                = 29
        bar_color                 = $bg1
        bar_blur                  = true
        bar_part_of_window        = true
        bar_precedence_over_border = true

        # Typography
        bar_title_enabled         = false
        bar_text_size             = 11
        bar_text_font             = "SF Pro Display Semibold"
        bar_text_align            = center
        col.text                  = $fg

        # Layout
        bar_buttons_alignment     = left
        bar_padding               = 12
        bar_button_padding        = 8
        icon_on_hover             = true

        # Buttons — [COLOR], [SIZE], [ICON], [ACTION]
        hyprbars-button = $red,    15, , hyprctl dispatch killactive
        hyprbars-button = $yellow, 15, , ~/.config/hypr/scripts/Plugins/hyprbars-minimize.sh
        hyprbars-button = $green,  15, , hyprctl dispatch togglefloating

        on_double_click = hyprctl dispatch fullscreen 1
    }

}