# /boot/limine/limine.conf
# Archer - Limine Bootloader Configuration

# ── Boot Behavior ─────────────────────────────────────────────
timeout: 3
default_entry: 1
remember_last_entry: yes
quiet: no

# ── Interface ─────────────────────────────────────────────────
interface_resolution: 1920x1080
interface_branding: Archer
interface_branding_colour: 74a86a
interface_help_hidden: yes

# ── Wallpaper ─────────────────────────────────────────────────
wallpaper: boot():/limine/limine.png
wallpaper_style: stretched

# ── Terminal Colors ───────────────────────────────────────────
term_background: cc051305
term_foreground: 74a86a
term_foreground_bright: a8d49e
term_palette: 051305;3a1a1a;2d5c2d;70a060;1a2a1a;3a3a1a;2d5c4a;508050
term_palette_bright: 162714;5c2a2a;4a8a4a;74a86a;2a3a2a;5c5a2a;4a7a6a;74a86a
term_margin: 12
term_margin_gradient: 10

# ── Boot Entry ────────────────────────────────────────────────
/Arch Linux (linux)
    protocol: efi
    path: boot():/EFI/Linux/arch-linux.efi
    cmdline: cryptdevice=PARTUUID=%%LUKS_PARTUUID%%:root root=/dev/mapper/root zswap.enabled=0 rootflags=subvol=@ rw rootfstype=btrfs quiet splash